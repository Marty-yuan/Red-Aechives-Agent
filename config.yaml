# ===== 红色村寨数字代言人 Agent - 项目配置 =====

# 档案路径
archives:
  pdf_dir: "D:/wechat/xwechat_files/wxid_aurvyfu68tio22_bd99/msg/file/2026-08/云南省红军长征档案文献/云南省红军长征档案文献"
  output_dir: "data/ocr_output"

# OCR 配置
ocr:
  engine: "paddleocr"      # paddleocr | tesseract
  language: "ch"            # 中文
  dpi: 300                  # PDF 渲染 DPI
  max_pages_per_pdf: 50     # 先处理前 50 页测试（设 -1 全量）

# 知识图谱
knowledge:
  chunk_size: 500           # 文本分块大小（字符）
  chunk_overlap: 50         # 分块重叠
  vector_store: "tfidf"     # tfidf | chromadb
  village_keywords:         # 村寨/地点关键词
    - 皎平渡
    - 石鼓
    - 扎西
    - 寻甸
    - 柯渡
    - 禄劝
    - 楚雄
    - 昭通
    - 曲靖
    - 丽江
    - 金沙江
    - 威信
    - 宣威
    - 元谋
    - 武定
    - 富民
    - 嵩明
    - 祥云
    - 宾川
    - 鹤庆
    - 昆明

# Agent 配置
agent:
  villages:                 # 目标村寨
    - 皎平渡
    - 扎西
    - 寻甸柯渡
    - 石鼓
    - 楚雄
  model: "gpt-4o-mini"     # LLM 模型（需配置 API Key）
  temperature: 0.7

# Web 服务
web:
  host: "0.0.0.0"
  port: 5000
  debug: true

# API 密钥（通过环境变量注入，不要直接写在这里）
# export OPENAI_API_KEY=sk-xxx
# export DEEPSEEK_API_KEY=sk-xxx
